# 개발 서버(Raspberry Pi pi2) 배포용 Compose — 스펙 023. 서버 /opt/rodi-app/ 에 위치(cd-dev.yml이 매 배포 시 전송).
# DB는 별도 Pi(pi)에 있어 app 하나만 띄운다. 같은 디렉터리의 .env 에서 값 주입(.env 는 git 커밋 금지, .env.dev.example 참고).
# 운영 compose(compose.prod.yaml)와 마찬가지로 새 환경변수는 environment에 명시해야 컨테이너로 전달된다.
name: rodi-dev

services:
  app:
    image: ghcr.io/central-makeus/rodi-server:${IMAGE_TAG:-develop}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://${DB_HOST:?DB_HOST를 .env에 설정하세요}:${DB_PORT:-5432}/${DB_NAME:-rodi_dev}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME을 .env에 설정하세요}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 설정하세요}   # 운영과 다른 값
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}                        # 탈퇴 시 카카오 unlink
      DISCORD_ERROR_WEBHOOK_URL: ${DISCORD_ERROR_WEBHOOK_URL:-}     # 운영과 같은 웹훅 — 메시지에 [dev] 라벨
      DISCORD_HEALTH_WEBHOOK_URL: ${DISCORD_HEALTH_WEBHOOK_URL:-}
      DEPLOY_BRANCH: ${DEPLOY_BRANCH:-}                             # 기동 알림용 배포 메타데이터(CD 주입)
      DEPLOY_COMMIT: ${DEPLOY_COMMIT:-}
      DEPLOY_MESSAGE: ${DEPLOY_MESSAGE:-}
      DEPLOY_REPO: ${DEPLOY_REPO:-}
      # pi2(4GB): 힙 상한 640MB. OOM이면 바로 종료해 restart 정책으로 다시 띄운다(반쯤 죽은 상태로 남지 않게)
      JAVA_OPTS: "-Xms256m -Xmx640m -XX:+ExitOnOutOfMemoryError"
    mem_limit: 1g            # 힙 640MB + 메타스페이스·스레드·코드캐시
    ports:
      - "127.0.0.1:8080:8080"  # pi2 자신만 접근. 외부는 Cloudflare Tunnel(dev-api.stillstar.store)로만 — cloudflared는 pi2 호스트(또는 network_mode: host)에서 localhost:8080으로 프록시해야 함
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s     # Pi는 기동·Flyway 검증이 느림
    logging:
      driver: json-file
      options:
        max-size: "10m"      # 16GB USB 보호
        max-file: "3"
