plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'jacoco'
    id 'org.sonarqube' version '5.1.0.4882'
}

group = 'cmc'
version = '0.0.1-SNAPSHOT'
description = 'Rodi'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // === Web ===
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // === Persistence (JPA + PostGIS) ===
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-spatial'
    runtimeOnly 'org.postgresql:postgresql'

    // === DB 마이그레이션 (Flyway) ===
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // === Security (OAuth2 + JWT) ===
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // === API 문서 ===
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // === 개발 편의 ===
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'  // bootRun 시 compose.yaml DB 자동 기동·연결

    // === Test ===
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // === 모니터링 ===
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}

// === 로컬 전용 dev 소스셋(스펙 021) ===
// src/dev: 마커 클러스터링 튜닝 페이지처럼 로컬 실행(bootRun)에서만 쓰는 코드. 배포 jar(bootJar)·운영 이미지에는 넣지 않는다.
// 운영 코드가 바뀌어 dev 코드가 깨지면 바로 알 수 있도록 check(= build)가 컴파일한다.
sourceSets {
    dev {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    devImplementation.extendsFrom implementation
    devCompileOnly.extendsFrom compileOnly
    devAnnotationProcessor.extendsFrom annotationProcessor
    devRuntimeOnly.extendsFrom runtimeOnly
}

tasks.named('bootRun') {
    classpath += sourceSets.dev.output
}

tasks.named('check') {
    dependsOn tasks.named('devClasses')
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true   // SonarCloud 커버리지 입력용
    }
}

spotless {
    java {
        googleJavaFormat().aosp()   // Google 포맷(4-space), 결정론적
        importOrder()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

sonar {
    properties {
        // SonarCloud 프로젝트 생성 후 표시되는 값으로 확인/교체
        property 'sonar.projectKey', 'Central-MakeUs_Rodi-Server'
        property 'sonar.organization', 'central-makeus'
        property 'sonar.host.url', 'https://sonarcloud.io'
    }
}
