server:
  # Caddy(HTTPS 종단) 뒤에서 X-Forwarded-* 헤더를 신뢰 → https 스킴 인식(Swagger가 https로 요청)
  forward-headers-strategy: framework

spring:
  application:
    name: Rodi
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true   # PostGIS 기본 객체(spatial_ref_sys 등)로 스키마가 비어있지 않아 필요
    baseline-version: 0         # 기본값 1이면 V1이 스킵됨 → 0으로 낮춰 V1부터 적용

# 지도 마커 클러스터링(스펙 021). 길이 단위는 Web Mercator(3857) — 한국 위도에서 지상 거리의 약 1.25배.
# 로컬 튜닝 페이지(/dev/cluster-tuning)에서 화면을 보며 정한 값을 여기에 반영한다.
marker-cluster:
  target-columns: 5          # 화면 가로에 들어갈 목표 칸 수(실제 약 3.5~7칸)
  no-cluster-width: 1250     # 화면 폭이 이 이하면 묶지 않음(지상 약 1km)
  cluster-inset-ratio: 0.25  # 클러스터 위치를 칸 가장자리에서 이 비율만큼 안쪽으로 제한
  max-cell-level: 18         # 가장 넓은 단계의 칸 = 2^18(지상 약 210km), 한반도 전체 화면용(튜닝 페이지로 확인, 2026-10-15)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"   # 모든 로그 줄에 요청별 traceId 표시

notification:
  discord:
    error-webhook-url: ${DISCORD_ERROR_WEBHOOK_URL:}    # 5xx 서버 오류 알림. 미설정 시 전송 안 함(로컬 등)
    health-webhook-url: ${DISCORD_HEALTH_WEBHOOK_URL:}  # 서버 기동/종료(재배포) 알림

# 배포 메타데이터 — CD가 배포 시점에 env로 주입(로컬은 비어 있음). 기동 알림·환경 라벨에 사용.
deploy:
  branch: ${DEPLOY_BRANCH:}     # 배포된 브랜치명(main/develop)
  commit: ${DEPLOY_COMMIT:}     # 배포 커밋 SHA
  message: ${DEPLOY_MESSAGE:}   # 배포 커밋 제목(스쿼시 머지면 끝에 (#PR번호))
  repo: ${DEPLOY_REPO:}         # owner/repo — PR 링크 구성용

management:
  endpoints:
    web:
      exposure:
        include: health          # 헬스체크만 노출(운영 정보 보호)
  endpoint:
    health:
      show-details: when-authorized   # 상세는 인증 시에만

jwt:
  secret: ${JWT_SECRET}   # 환경변수로만 주입(기본값 없음)
  access-token-ttl: 30m
  refresh-token-ttl: 14d

oauth:
  kakao:
    user-info-uri: https://kapi.kakao.com/v2/user/me   # accessToken 검증 방식(코드 교환 X)
    unlink-uri: https://kapi.kakao.com/v1/user/unlink  # 탈퇴 시 연결 해제(Admin Key 방식)
    admin-key: ${KAKAO_ADMIN_KEY:}                     # 시크릿(미설정 시 카카오 unlink만 불가)
  apple:
    issuer: https://appleid.apple.com
    token-uri: https://appleid.apple.com/auth/token
    jwks-uri: https://appleid.apple.com/auth/keys
    revoke-uri: https://appleid.apple.com/auth/revoke  # 탈퇴 시 토큰 revoke
    team-id: ${APPLE_TEAM_ID:}          # env 주입(미설정 시 애플 로그인만 불가, 앱 기동은 정상)
    key-id: ${APPLE_KEY_ID:}
    client-id: ${APPLE_CLIENT_ID:}      # Bundle ID
    private-key: ${APPLE_PRIVATE_KEY:}  # .p8 내용(시크릿)
