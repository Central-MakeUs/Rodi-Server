name: CD (dev · pi2)

# develop push 시: 테스트 → ARM64 이미지 빌드/GHCR push → Raspberry Pi 개발 서버(pi2) 배포 — 스펙 023
# pi2는 가정용 사설망이라 배포 잡만 Tailscale(OIDC, 임시 노드)로 tailnet에 들어와 SSH로 배포한다(인바운드 포트 없음).
# 운영(main → Lightsail)은 cd.yml 이 따로 담당한다.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "재배포·롤백할 기존 이미지 태그(예: dev-<sha>). 비우면 현재 커밋을 빌드해 배포"
        required: false
        default: ""

concurrency:
  group: cd-dev               # 운영 cd-deploy 와 별개. 개발 서버 배포끼리만 직렬화
  cancel-in-progress: false   # 배포는 중간에 취소하지 않음

permissions: {}   # 기본 권한 없음 — 잡마다 필요한 것만 연다

jobs:
  test:
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

  build-push:
    needs: test
    runs-on: ubuntu-24.04-arm   # ARM 호스티드 러너에서 네이티브 빌드(QEMU 없음). public 레포는 무료
    permissions:
      contents: read
      packages: write        # GHCR push
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # :dev-<sha> 는 배포에 사용(운영 :<sha> 와 접두어로 구분 — 아키텍처가 다른 이미지가 같은 태그를 덮지 않게), :develop 은 이동 태그
          tags: |
            ${{ steps.img.outputs.name }}:dev-${{ github.sha }}
            ${{ steps.img.outputs.name }}:develop
          cache-from: type=gha,scope=dev-arm64
          cache-to: type=gha,mode=max,scope=dev-arm64   # 운영(amd64) 캐시와 분리

  deploy:
    needs: [test, build-push]
    # 빌드 성공 시, 또는 image_tag 지정 재배포 시. Tailscale OIDC subject가 develop 이라 develop 에서만 실행
    if: >-
      !cancelled() && github.ref == 'refs/heads/develop' &&
      (needs.build-push.result == 'success' || inputs.image_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read         # pi2가 GHCR에서 pull (잡 토큰으로 로그인)
      id-token: write        # Tailscale OIDC(Workload Identity Federation) 토큰 발급
    env:
      IMAGE_TAG: ${{ inputs.image_tag || format('dev-{0}', github.sha) }}
      PI2_HOST: ${{ secrets.PI2_HOST }}
    steps:
      - uses: actions/checkout@v4

      # 장기 비밀값 없이 GitHub OIDC 토큰으로 인증. 임시 노드라 잡이 끝나면 사라지고, ACL로 tag:server 의 22번만 접근 가능
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      # 호스트 키 검증: known_hosts 를 레포 시크릿(pi2 공개 호스트 키)으로 고정 → 다른 서버면 접속 거부
      - name: Set up SSH
        env:
          PI2_SSH_KEY: ${{ secrets.PI2_SSH_KEY }}
          PI2_SSH_HOST_KEY: ${{ secrets.PI2_SSH_HOST_KEY }}
          PI2_SSH_USER: ${{ vars.PI2_SSH_USER }}   # 비밀값이 아니라 Variable — Secret이면 로그의 "deploy" 단어가 전부 *** 로 가려진다
        run: |
          : "${PI2_HOST:?secrets.PI2_HOST 미설정}" "${PI2_SSH_USER:?vars.PI2_SSH_USER 미설정}"
          : "${PI2_SSH_KEY:?secrets.PI2_SSH_KEY 미설정}"
          : "${PI2_SSH_HOST_KEY:?secrets.PI2_SSH_HOST_KEY 미설정 — pi2의 /etc/ssh/ssh_host_ed25519_key.pub 내용}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PI2_SSH_KEY" > ~/.ssh/pi2 && chmod 600 ~/.ssh/pi2
          printf '%s %s\n' "$PI2_HOST" "$PI2_SSH_HOST_KEY" > ~/.ssh/known_hosts
          # 이후 스텝은 `ssh pi2` / `scp ... pi2:` 로 접속. 호스트 키가 known_hosts 와 다르면 접속 거부
          cat > ~/.ssh/config <<EOF
          Host pi2
            HostName $PI2_HOST
            User $PI2_SSH_USER
            IdentityFile ~/.ssh/pi2
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 10
          EOF

      # 사전 점검: 네트워크·인증 문제를 배포 실패와 구분해 바로 원인이 보이게
      - name: Check Tailscale & SSH reachability
        run: |
          tailscale status --self --peers=false || true   # 정보 출력용
          for i in $(seq 1 10); do
            nc -z -w 5 "$PI2_HOST" 22 && break
            [ "$i" = 10 ] && { echo "::error::pi2:22 에 닿지 않음(Tailscale ACL·pi2 상태 확인)"; exit 1; }
            sleep 3
          done
          ssh pi2 'echo "ssh ok: $(hostname)"; docker version --format "docker {{.Server.Version}}"'

      - name: Copy deploy files
        run: scp deploy/compose.dev.yaml deploy/deploy-dev.sh pi2:/opt/rodi-app/

      # GHCR 로그인은 잡 토큰(이 잡 동안만 유효)으로 — pi2에 PAT를 두지 않는다. 마지막 스텝에서 로그아웃
      - name: Login pi2 to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh pi2 "docker login ghcr.io -u $(printf %q "$GITHUB_ACTOR") --password-stdin"

      # 헬스체크 통과까지 대기, 실패하면 컨테이너 로그 출력 + 직전 성공 태그로 자동 롤백 후 잡 실패
      # 배포 메타데이터는 스크립트에 직접 넣지 않고 printf %q 로 이스케이프해 전달(주입 안전)
      - name: Deploy
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message }}
          DEPLOY_REPO: ${{ github.repository }}
        run: |
          DEPLOY_MESSAGE="$(printf '%s' "$DEPLOY_MESSAGE" | head -n1)"
          printf 'export IMAGE_TAG=%q DEPLOY_BRANCH=%q DEPLOY_COMMIT=%q DEPLOY_MESSAGE=%q DEPLOY_REPO=%q\nexec bash /opt/rodi-app/deploy-dev.sh\n' \
            "$IMAGE_TAG" "$DEPLOY_BRANCH" "$DEPLOY_COMMIT" "$DEPLOY_MESSAGE" "$DEPLOY_REPO" \
            | ssh pi2 'bash -s'

      - name: Logout pi2 from GHCR
        if: always()
        run: ssh pi2 'docker logout ghcr.io' || true
